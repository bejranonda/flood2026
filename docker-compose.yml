# BKK FloodWatch — single-server stack (D-013). Start: docker compose up -d --build
name: floodwatch
x-appenv: &appenv
  DATABASE_URL: postgresql://floodwatch:${POSTGRES_PASSWORD}@db:5432/floodwatch
  FEEDBACK_SALT: ${FEEDBACK_SALT:-}
  TELEMETRY_ARCHIVE_PATH: /data/raw_archive
  HTTP_USER_AGENT: ${HTTP_USER_AGENT:-BKK-FloodWatch/0.2 (+https://flood.autobahn.bot)}
  THAI_EGRESS_PROXY: ${THAI_EGRESS_PROXY:-}   # e.g. http://vpn:8888 with --profile vpn
  MIN_FREE_DISK_GB: ${MIN_FREE_DISK_GB:-2}
  REDIRECT_LEGACY_HOST: ${REDIRECT_LEGACY_HOST:-0}   # 1 = 301 flood.bejranonda.com pages -> flood.autobahn.bot; /api/* stays (D-034)
  GISTDA_API_KEY: ${GISTDA_API_KEY:-}
  GISTDA_API_ENDPOINT: ${GISTDA_API_ENDPOINT:-https://api-gateway.gistda.or.th/api/2.0/resources/gi-service/v1.0/disasters/flood-extent-1day}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: floodwatch
      POSTGRES_USER: floodwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=16MB", "-c", "max_connections=40"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodwatch"]
      interval: 10s
      retries: 10
    mem_limit: 1g

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "floodwatch.worker"]
    environment:
      <<: *appenv
      # Optional AI feedback triage (D-022, D-030), worker only: the web app never calls AI.
      # Supported providers: glm (Zhipu AI) or cloudflare (Workers AI).
      AI_ENABLED: ${AI_ENABLED:-1}
      AI_PROVIDER: ${AI_PROVIDER:-glm}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_MODEL: ${GLM_MODEL:-glm-5.3-flash}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CF_AI_TOKEN: ${CF_AI_TOKEN:-${CLOUDFLARE_API_TOKEN:-}}
      AI_MODEL: ${AI_MODEL:-@cf/aisingapore/gemma-sea-lion-v4-27b-it}
      AI_DAILY_NEURON_BUDGET: ${AI_DAILY_NEURON_BUDGET:-3000}
    volumes:
      - ./data/raw_archive:/data/raw_archive
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 1g

  # Forecasts in their own container (D-064): ~1,000 gauges take minutes; the collectors never wait for them.
  forecaster:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "floodwatch.worker", "--role", "forecaster"]
    environment: *appenv
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 1g

  app:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "floodwatch.api:app", "--host", "0.0.0.0", "--port", "3000", "--workers", "2", "--proxy-headers"]
    environment: *appenv
    ports:
      - "127.0.0.1:3000:3000"   # local only; public traffic comes through the tunnel
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--url", "http://app:3000"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on: [app]
    profiles: ["public"]

  # Fallback while the API token lacks Tunnel:Edit (KI-501): serve the origin directly, Cloudflare IPs only.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on: [app]
    profiles: ["origin"]

  # Thai egress for geo-blocked public pages (D-014). Isolated network namespace: only traffic sent to
  # http://vpn:8888 leaves via the OpenVPN relay; host routes are untouched. Start: --profile vpn
  vpn:
    build: ./infra/vpn
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes:
      - ./infra/openvpn:/vpn:ro
    mem_limit: 128m
    profiles: ["vpn"]
